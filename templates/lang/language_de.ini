[DEVICES]
SECTION=Geräte für Alexa
NO_PAIRINGS_TITLE=Skill noch nicht verknüpft
NO_PAIRINGS_BODY=Geräte hier zu konfigurieren ist erst sinnvoll, wenn die Aloxberry-Skill mit deinem Alexa-Konto verknüpft wurde. Wechsle zuerst zum Einrichtungs-Tab und folge dort den Pairing-Anweisungen.
NO_PAIRINGS_GOTO=Zur Einrichtung
GATEKEEPER_TITLE=Alexa-Integration
MASTER_LABEL=Alexa-Integration aktiv
MASTER_HINT=Wenn aus, kappt der Daemon jegliche Bridge-Kommunikation. Alexa erreicht diesen LoxBerry erst wieder nach erneuter Aktivierung.
VACATION_LABEL=Alexa-Befehle pausieren, wenn ein Virtual Status aktiv ist
VACATION_HINT=Wenn aktiv, werden Alexa→Miniserver-Befehle blockiert, solange der gewählte Loxone Virtual Status EIN ist; Status-Meldungen fließen weiterhin zu Alexa.
VACATION_MODE=Virtual Status
VACATION_PICK=Virtual Status wählen
VACATION_NO_VS=(kein Virtual Status gefunden — in Loxone Config anlegen)
CATALOGUE_HEADING=Loxone-Katalog
CATALOGUE_UNAVAILABLE_TITLE=Katalog nicht verfügbar
CATALOGUE_UNAVAILABLE_BODY=Der Daemon hat die LoxAPP3.json-Struktur vom Miniserver noch nicht gelesen, und es liegt keine zwischengespeicherte Version auf der Festplatte. Starte den Daemon (Tab „Einrichtung“) oder klicke auf „Vom Miniserver aktualisieren“, sobald die Verbindung steht.
REFRESH_BTN=Katalog aktualisieren
CONTROLS=Controls
FETCHED_AT=geladen
STALE=veraltet (aus Festplatten-Cache)
FILTERS=Filter
AVAILABLE=Verfügbare Loxone-Controls
EXPOSED=Für Alexa freigegeben
NO_CANDIDATES=Keine Controls entsprechen den aktuellen Filtern.
NO_EXPOSED=Noch keine Geräte freigegeben. Wähle eines von links aus.
ADD=Hinzufügen
REMOVE=Entfernen
ENABLED=Aktiv
FRIENDLY_NAME=Anzeigename
CATEGORY=Kategorie
CAPABILITIES=Fähigkeiten
