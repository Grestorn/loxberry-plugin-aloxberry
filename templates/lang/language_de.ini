MODE_LABEL_INACTIVE=Inaktiv:
PHASE3=(Phase 3)
ORPHAN=Dieses Control ist nicht mehr im Loxone-Katalog. Entferne es oder repariere es in Loxone Config und aktualisiere den Katalog.
INCOMPATIBLE=von Alexa nicht unterstützt
IN_PARENT=in
ALL_ROOMS=Alle Räume
ALL_TYPES=Alle Typen
ALL_CATEGORIES=Alle Kategorien
HIDE_EXPOSED=Bereits freigegebene ausblenden
HIDE_INCOMPATIBLE=Nicht von Alexa unterstützte Typen ausblenden
UNSAVED=Ungespeicherte Änderungen
SAVE=Änderungen speichern
SAVE_EMPTY=Keine Gerätedaten übermittelt.
SAVE_BAD_JSON=Übermittelte Daten sind kein gültiges JSON.
SAVE_FAILED=devices.json konnte nicht geschrieben werden: {err}
SAVE_OK={count} Gerät(e) gespeichert. Sage „Alexa, suche nach Geräten.“ damit Alexa die Änderungen übernimmt.
MIGRATION_NOTICE=Bei {count} Gerät(en) wurde die Kategorie automatisch aktualisiert, weil Alexa die alte nicht mehr unterstützt. Sage „Alexa, suche nach Geräten“, damit die Änderung wirksam wird.
TIP_ENABLED=Abwählen, um dieses Gerät konfiguriert zu lassen, es aber vor Alexa zu verbergen (keine Erkennung, keine Befehle) – ohne die Einstellungen zu verlieren.
TIP_FRIENDLY_NAME=Der Name, den Alexa für dieses Gerät anzeigt und mit dem du es per Sprache steuerst, z. B. „Alexa, schalte <Name> ein“. Eindeutig und gut aussprechbar wählen; Dopplungen über Räume hinweg vermeiden.
TIP_CATEGORY=Teilt Alexa mit, um welche Art Gerät es sich handelt – steuert Kachel, Symbol und einen Teil der Sprachformulierung. SCENE_TRIGGER und ACTIVITY_TRIGGER lassen Alexa es als Szene behandeln: per Sprache und in Routinen nutzbar, aber OHNE Gerätekachel, und es kann in der Alexa-App nicht umbenannt oder gelöscht werden. Alle anderen Kategorien erscheinen als normales Gerät.
TIP_CAPABILITIES=Welche Alexa-Funktionen dieses Gerät bereitstellt. Jede Checkbox ist eine Alexa-Fähigkeit; ausgegraute sind im Daemon noch nicht implementiert.
TIP_SETTINGS=Gerätespezifische Optionen, die das Verhalten der gewählten Fähigkeiten feinjustieren.
TIP_CAP_POWERCONTROLLER=Ein/Aus-Steuerung. „Alexa, schalte <Name> ein/aus.“
TIP_CAP_BRIGHTNESSCONTROLLER=Dimmen von 0 bis 100 %. „Alexa, stelle <Name> auf 40 %“, „dimme <Name>.“
TIP_CAP_COLORCONTROLLER=Volle Farbe (Farbton und Sättigung). „Alexa, mache <Name> blau.“
TIP_CAP_COLORTEMPERATURECONTROLLER=Weiß-Farbtemperatur. „Alexa, mache <Name> warmweiß / kühler.“
TIP_CAP_MODECONTROLLER=Auswählbare benannte Modi oder Voreinstellungen – Lichtszenen, Lüftermodus, Radiosender usw. „Alexa, stelle <Name> auf <Modus>.“
TIP_CAP_RANGECONTROLLER=Ein Zahlenwert über einen Bereich, z. B. Jalousieposition oder ein Schieberegler. „Alexa, stelle <Name> auf 50.“
TIP_CAP_SCENECONTROLLER=Ein einmaliger Auslöser (Taster/Szene). Per Sprache oder in Routinen ausführbar; erscheint unter Szenen, nicht als Gerätekachel.
TIP_CAP_THERMOSTATCONTROLLER=Zieltemperatur plus Heiz-/Kühlmodus. „Alexa, stelle <Name> auf 21 Grad.“
TIP_CAP_TEMPERATURESENSOR=Meldet die gemessene Temperatur an Alexa (nur lesend). „Alexa, wie ist die Temperatur von <Name>?“
TIP_CAP_SPEAKER=Lautstärke und Stummschaltung einer Audiozone. „Alexa, stelle <Name> Lautstärke auf 4“, „schalte <Name> stumm.“
TIP_CAP_PLAYBACKCONTROLLER=Wiedergabe-Steuerung (Play/Pause/Stopp/weiter/zurück). Hinweis: Alexa leitet diese oft an den eigenen Musikdienst statt an den Skill.
TIP_CAP_PLAYBACKSTATEREPORTER=Meldet Wiedergabe-/Pause-/Stopp-Status, damit Alexas „Läuft gerade“-Kachel synchron bleibt (nur lesend).
TIP_CAP_TOGGLECONTROLLER=Ein Ein/Aus-Schalter für eine benannte Funktion, z. B. Zufallswiedergabe. „Alexa, schalte Zufallswiedergabe bei <Name> ein.“
TIP_CAP_MOTIONSENSOR=Meldet Bewegung/Anwesenheit erkannt vs. frei (nur lesend); als Routinen-Auslöser nutzbar.
TIP_CAP_CONTACTSENSOR=Meldet offen vs. geschlossen (nur lesend); als Routinen-Auslöser nutzbar.
TIP_CAP_HUMIDITYSENSOR=Meldet die relative Luftfeuchte in % an Alexa (nur lesend).
TIP_CAP_ENDPOINTHEALTH=Meldet, ob das Gerät erreichbar ist. Automatisch hinzugefügt; nicht auswählbar.
TIP_REVERSE_AXIS=Kehrt die Bereichsrichtung um, sodass 0 % und 100 % vertauscht sind. Nutzen, wenn eine Jalousie/ein Regler entgegengesetzt zu Alexas Erwartung läuft.
TIP_USE_OVERRIDE=Wenn gesetzt, wird eine Temperaturänderung von Alexa als zeitlich begrenzte manuelle Übersteuerung gesendet, statt den Loxone-Zeitplan dauerhaft zu ändern.
TIP_OVERRIDE_HOURS=Wie viele Stunden eine manuelle Temperatur-Übersteuerung aktiv bleibt, bevor der Loxone-Zeitplan wieder greift (1-168).
TIP_VOLUME_STEP=Prozent, um die sich die Lautstärke je „lauter/leiser“-Sprachschritt ändert (1-50).
TIP_INVERT_POLARITY=Vertauscht die Auslegung offen/geschlossen (erkannt/frei) des Sensors. Nutzen, wenn der Kontakt invertiert meldet.
TIP_VENTILATION_HOURS=Wie lange eine per Alexa angeforderte Geschwindigkeits- oder Modusänderung aktiv bleibt, bevor die Lüftung in den Automatikbetrieb zurückkehrt (1-168 Std.).
TIP_MODE_LABEL_ACTIVE=Eigener Text, den Alexa für den „aktiven“ Zustand des Sensors anzeigt, z. B. „Offen“. Leer lassen für den Standard.
TIP_MODE_LABEL_INACTIVE=Eigener Text, den Alexa für den „inaktiven“ Zustand anzeigt, z. B. „Geschlossen“. Leer lassen für den Standard.

