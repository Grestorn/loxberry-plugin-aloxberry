[HEALTH]
BRIDGE_DOWN_TITLE=Verbindung zur Aloxberry-Cloud-Bridge ist unterbrochen
BRIDGE_DOWN_BODY=Alexa kann deinen LoxBerry gerade nicht erreichen und es fließen keine Statusmeldungen zu Alexa. Öffne den Einrichtungs-Tab und prüfe Bridge-Status und Daemon-Log.
REVOKED_TITLE=Alexa-Skill neu verknüpfen
REVOKED_BODY_ONE=Ein Alexa-Konto hat die Berechtigung verloren, Statusmeldungen von deinem LoxBerry zu empfangen. Verknüpfe die Aloxberry-Skill in der Alexa-App neu, um sie wiederherzustellen.
REVOKED_BODY_MANY={count} Alexa-Konten haben die Berechtigung verloren, Statusmeldungen von deinem LoxBerry zu empfangen. Verknüpfe die Aloxberry-Skill in der Alexa-App neu, um sie wiederherzustellen.
REVOKED_STEPS=In der Alexa-App: Skills & Spiele → Deine Skills → Aloxberry → Skill deaktivieren, dann erneut aktivieren und verknüpfen.
REVOKED_WHY=Tritt üblicherweise auf, wenn jemand die Skill in der Alexa-App deaktiviert hat oder nach längerer Inaktivität. Sprachbefehle funktionieren ggf. weiter, aber Statusänderungen in Loxone erscheinen erst nach erneuter Verknüpfung in Alexa.
REVOKED_BADGE=neu verknüpfen
OK_BADGE=ok

[SETTINGS]
SECTION=Einstellungen
INSTRUCTIONS=Laufzeit-Konfiguration des Daemons. Beim Speichern wird der Daemon automatisch neu gestartet, damit die neuen Werte sofort wirksam werden.
BRIDGE_URL=Bridge-URL
LOCAL_PORT=Lokaler API-Port
SAVE_BTN=Einstellungen speichern und Daemon neu starten
SAVED=Einstellungen gespeichert und Daemon neu gestartet.
SAVED_RESTART_FAILED=Einstellungen gespeichert, aber Daemon-Neustart fehlgeschlagen: {out}
SAVE_FAILED=daemon.env konnte nicht geschrieben werden: {err}
ERR_URL=Die Bridge-URL muss mit http:// oder https:// beginnen.
ERR_PORT=Der lokale API-Port muss eine Zahl zwischen 1024 und 65535 sein.
MS_MODE=Miniserver-Verbindung
MS_MODE_WS=Live (permanente WebSocket-Verbindung)
MS_MODE_POLL=Polling (keine permanente Verbindung)
MS_POLL_INTERVAL=Abfrage-Intervall (Minuten)
MS_MODE_HINT=Im Polling-Modus hält der Daemon keine permanente Verbindung zum Miniserver: Im eingestellten Intervall verbindet er sich kurz, liest alle Zustände und trennt die Verbindung wieder. Zustandsänderungen erreichen Alexa mit bis zu einem Intervall Verzögerung; Sprachbefehle sind nicht betroffen. Nützlich, wenn der Netzwerk-Stack des Miniservers mit permanenten Verbindungen instabil ist.
ERR_MS_MODE=Ungültiger Verbindungsmodus für den Miniserver.
ERR_POLL_INTERVAL=Das Abfrage-Intervall muss eine Zahl zwischen 1 und 1440 Minuten sein.
