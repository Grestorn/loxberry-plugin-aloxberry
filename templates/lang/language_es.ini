MODE_LABEL_INACTIVE=Inactivo:
PHASE3=(Fase 3)
ORPHAN=Este control ya no está en el catálogo de Loxone. Elimínalo, o corrígelo en Loxone Config y actualiza.
INCOMPATIBLE=no compatible con Alexa
IN_PARENT=en
ALL_ROOMS=Todas las habitaciones
ALL_TYPES=Todos los tipos
ALL_CATEGORIES=Todas las categorías
HIDE_EXPOSED=Ocultar los ya expuestos
HIDE_INCOMPATIBLE=Ocultar los tipos no compatibles con Alexa
UNSAVED=Cambios sin guardar
SAVE=Guardar cambios
SAVE_EMPTY=No se enviaron datos de dispositivos.
SAVE_BAD_JSON=Los datos enviados no son JSON válido.
SAVE_FAILED=No se pudo escribir devices.json: {err}
SAVE_OK=Guardado(s) {count} dispositivo(s). Di "Alexa, descubre mis dispositivos" para que Alexa tome los cambios.
MIGRATION_NOTICE=La categoría de {count} dispositivo(s) se actualizó automáticamente porque Alexa ya no admite la anterior. Di "Alexa, descubre mis dispositivos" para que los cambios se apliquen.
TIP_ENABLED=Desmarca para mantener este dispositivo configurado pero oculto a Alexa (sin descubrimiento ni comandos) sin perder sus ajustes.
TIP_FRIENDLY_NAME=El nombre que Alexa muestra para este dispositivo y que dices para controlarlo por voz, p. ej. "Alexa, enciende <nombre>". Mantenlo único y fácil de pronunciar; evita duplicados entre habitaciones.
TIP_CATEGORY=Le dice a Alexa qué tipo de dispositivo es — controla la tarjeta, el icono y algunas frases de voz. SCENE_TRIGGER y ACTIVITY_TRIGGER hacen que Alexa lo trate como una Escena: usable por voz y en Rutinas, pero SIN tarjeta de dispositivo, y no se puede renombrar ni eliminar en la app de Alexa. Cualquier otra categoría aparece como un dispositivo normal.
TIP_CAPABILITIES=Qué funciones de Alexa expone este dispositivo. Cada casilla es una capacidad de Alexa; las atenuadas aún no están implementadas en el daemon.
TIP_SETTINGS=Opciones por dispositivo que afinan el comportamiento de las capacidades seleccionadas.
TIP_CAP_POWERCONTROLLER=Encendido/apagado. "Alexa, enciende/apaga <nombre>."
TIP_CAP_BRIGHTNESSCONTROLLER=Atenuación de 0 a 100%. "Alexa, pon <nombre> al 40%", "atenúa <nombre>."
TIP_CAP_COLORCONTROLLER=Color completo (tono y saturación). "Alexa, pon <nombre> en azul."
TIP_CAP_COLORTEMPERATURECONTROLLER=Temperatura del blanco. "Alexa, pon <nombre> en blanco cálido / más frío."
TIP_CAP_MODECONTROLLER=Modos o ajustes con nombre — escenas de luz, modo ventilador, emisora de radio, etc. "Alexa, pon <nombre> en <modo>."
TIP_CAP_RANGECONTROLLER=Un valor numérico en un rango, p. ej. posición de persiana o un deslizador. "Alexa, pon <nombre> a 50."
TIP_CAP_SCENECONTROLLER=Un disparador puntual (pulsador/escena). Se ejecuta por voz o en Rutinas; aparece bajo Escenas, no como tarjeta de dispositivo.
TIP_CAP_THERMOSTATCONTROLLER=Temperatura objetivo más modo calefacción/refrigeración. "Alexa, pon <nombre> a 21 grados."
TIP_CAP_TEMPERATURESENSOR=Informa la temperatura medida a Alexa (solo lectura). "Alexa, ¿cuál es la temperatura de <nombre>?"
TIP_CAP_SPEAKER=Volumen y silencio para una zona de audio. "Alexa, pon el volumen de <nombre> en 4", "silencia <nombre>."
TIP_CAP_PLAYBACKCONTROLLER=Controles de reproducción (reproducir/pausa/parar/siguiente/anterior). Nota: Alexa suele enrutarlos a su propio servicio de música en lugar de a la skill.
TIP_CAP_PLAYBACKSTATEREPORTER=Informa el estado reproducir/pausa/parar para que la tarjeta "Reproduciendo ahora" de Alexa se mantenga sincronizada (solo lectura).
TIP_CAP_TOGGLECONTROLLER=Un interruptor on/off para una función con nombre, p. ej. aleatorio. "Alexa, activa aleatorio en <nombre>."
TIP_CAP_MOTIONSENSOR=Informa movimiento/presencia detectado vs. despejado (solo lectura); utilizable como disparador de Rutina.
TIP_CAP_CONTACTSENSOR=Informa abierto vs. cerrado (solo lectura); utilizable como disparador de Rutina.
TIP_CAP_HUMIDITYSENSOR=Informa la humedad relativa en % a Alexa (solo lectura).
TIP_CAP_ENDPOINTHEALTH=Informa si el dispositivo es alcanzable. Añadida automáticamente; no seleccionable.
TIP_REVERSE_AXIS=Invierte la dirección del rango, intercambiando 0% y 100%. Úsalo si una persiana o deslizador funciona al revés de lo que Alexa espera.
TIP_TIMED_TRIGGER_SLS=Modo luz de escalera: "Alexa, enciende" inicia (o reinicia) el temporizador de Loxone en lugar de encender de forma permanente, así la luz se apaga sola al acabar el tiempo. "Apaga" sigue apagando de inmediato.
TIP_TIMED_TRIGGER_CSW=Modo interruptor confort: "Alexa, enciende" envía un impulso al temporizador. Si la luz está apagada se enciende durante el tiempo configurado; si ya está encendida el mismo impulso la apaga. "Apaga" siempre apaga de inmediato.
TIP_USE_OVERRIDE=Si está activado, un cambio de temperatura desde Alexa se envía como anulación manual temporizada en lugar de cambiar permanentemente la programación de Loxone.
TIP_OVERRIDE_HOURS=Cuántas horas permanece activa una anulación manual de temperatura antes de que vuelva la programación de Loxone (1-168).
TIP_VOLUME_STEP=Porcentaje de variación del volumen por cada paso de voz "más alto/más bajo" (1-50).
TIP_INVERT_POLARITY=Intercambia la interpretación abierto/cerrado (detectado/despejado) del sensor. Úsalo si el contacto informa al revés.
TIP_VENTILATION_HOURS=Cuánto tiempo permanece aplicado un cambio de velocidad o modo solicitado vía Alexa antes de que la ventilación vuelva al automático (1-168 h).
TIP_MODE_LABEL_ACTIVE=Texto personalizado que Alexa muestra para el estado "activo" del sensor, p. ej. "Abierto". Déjalo en blanco para el valor predeterminado.
TIP_MODE_LABEL_INACTIVE=Texto personalizado que Alexa muestra para el estado "inactivo", p. ej. "Cerrado". Déjalo en blanco para el valor predeterminado.

