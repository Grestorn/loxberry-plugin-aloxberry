[DEVICES]
SECTION=Dispositivos expuestos a Alexa
NO_PAIRINGS_TITLE=Skill aún no vinculada
NO_PAIRINGS_BODY=Configurar dispositivos aquí solo tiene sentido una vez que la skill Aloxberry esté vinculada a tu cuenta de Alexa. Abre primero la pestaña Configuración y sigue allí las instrucciones de emparejamiento.
NO_PAIRINGS_GOTO=Ir a Configuración
GATEKEEPER_TITLE=Integración con Alexa
MASTER_LABEL=Integración con Alexa activa
MASTER_HINT=Si está apagada, el daemon corta toda comunicación con la bridge. Alexa no podrá alcanzar este LoxBerry hasta que la vuelvas a activar.
VACATION_LABEL=Pausar comandos de Alexa mientras un Virtual Status esté activo
VACATION_HINT=Si está activado, los comandos Alexa→Miniserver se bloquean mientras el Virtual Status Loxone elegido esté en ON; las actualizaciones de estado siguen fluyendo hacia Alexa.
VACATION_MODE=Virtual Status
VACATION_PICK=elige un Virtual Status
VACATION_NO_VS=(no se encontró ningún Virtual Status — crea uno en Loxone Config)
CATALOGUE_HEADING=Catálogo de Loxone
CATALOGUE_UNAVAILABLE_TITLE=Catálogo no disponible
CATALOGUE_UNAVAILABLE_BODY=El daemon aún no ha leído la estructura LoxAPP3.json del Miniserver y no hay copia en caché en disco. Inicia el daemon (pestaña Configuración) o haz clic en "Actualizar desde el Miniserver" en cuanto esté conectado.
REFRESH_BTN=Actualizar catálogo
CONTROLS=controles
FETCHED_AT=obtenido
STALE=desactualizado (usando caché en disco)
FILTERS=Filtros
AVAILABLE=Controles Loxone disponibles
EXPOSED=Expuestos a Alexa
NO_CANDIDATES=Ningún control coincide con los filtros actuales.
NO_EXPOSED=Aún no hay dispositivos expuestos. Elige uno de la izquierda.
ADD=Añadir
REMOVE=Quitar
ENABLED=Activo
FRIENDLY_NAME=Nombre amigable
CATEGORY=Categoría
CAPABILITIES=Capacidades
