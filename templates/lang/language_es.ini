[HEALTH]
BRIDGE_DOWN_TITLE=La conexión con la bridge en la nube de Aloxberry está caída
BRIDGE_DOWN_BODY=Alexa no puede alcanzar tu LoxBerry ahora mismo y las actualizaciones de estado no están llegando a Alexa. Abre la pestaña Configuración para revisar el estado de la bridge y el registro del daemon.
REVOKED_TITLE=Re-vincula tu skill de Alexa
REVOKED_BODY_ONE=Una cuenta de Alexa ha perdido el permiso para recibir actualizaciones de estado desde tu LoxBerry. Re-vincula la skill Aloxberry en la app de Alexa para restaurarla.
REVOKED_BODY_MANY={count} cuentas de Alexa han perdido el permiso para recibir actualizaciones de estado desde tu LoxBerry. Re-vincula la skill Aloxberry en la app de Alexa para restaurarlas.
REVOKED_STEPS=En la app de Alexa: Skills y Juegos → Tus Skills → Aloxberry → Desactivar skill, luego Activar y Vincular de nuevo.
REVOKED_WHY=Suele ocurrir cuando alguien desactiva la skill en la app de Alexa, o tras un largo período de inactividad. Los comandos de voz pueden seguir funcionando, pero los cambios de estado de los dispositivos en Loxone no se reflejarán en Alexa hasta que re-vincules.
REVOKED_BADGE=re-vincular
OK_BADGE=ok

[SETTINGS]
SECTION=Ajustes
INSTRUCTIONS=Configuración de tiempo de ejecución del daemon. Al guardar se reinicia automáticamente el daemon para que los nuevos valores surtan efecto de inmediato.
BRIDGE_URL=URL de la bridge
LOCAL_PORT=Puerto de la API local
SAVE_BTN=Guardar ajustes y reiniciar daemon
SAVED=Ajustes guardados y daemon reiniciado.
SAVED_RESTART_FAILED=Ajustes guardados, pero falló el reinicio del daemon: {out}
SAVE_FAILED=No se pudo escribir daemon.env: {err}
ERR_URL=La URL de la bridge debe ser una URL http:// o https://.
ERR_PORT=El puerto de la API local debe ser un número entre 1024 y 65535.
MS_MODE=Conexión al Miniserver
MS_MODE_WS=En vivo (WebSocket permanente)
MS_MODE_POLL=Sondeo (sin conexión permanente)
MS_POLL_INTERVAL=Intervalo de sondeo (minutos)
MS_MODE_HINT=En modo sondeo, el daemon no mantiene ninguna conexión permanente con el Miniserver: en cada intervalo se conecta brevemente, lee todos los estados y se desconecta. Los cambios de estado llegan a Alexa con un retraso de hasta un intervalo; los comandos de voz no se ven afectados. Útil si la pila de red del Miniserver es inestable con conexiones permanentes.
ERR_MS_MODE=Modo de conexión al Miniserver no válido.
ERR_POLL_INTERVAL=El intervalo de sondeo debe ser un número entre 1 y 1440 minutos.
