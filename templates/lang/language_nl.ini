MS_MODE_HINT=In polling-modus houdt de daemon geen permanente verbinding met de Miniserver: per interval maakt hij kort verbinding, leest alle toestanden en verbreekt de verbinding weer. Toestandswijzigingen bereiken Alexa met maximaal één interval vertraging; spraakopdrachten worden niet beïnvloed. Handig als de netwerkstack van de Miniserver instabiel is bij permanente verbindingen.
