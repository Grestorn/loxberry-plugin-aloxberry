REVOKED_TITLE=Koppel je Alexa-skill opnieuw
REVOKED_BODY_ONE=Eén Alexa-account heeft de toestemming verloren om statusupdates van je LoxBerry te ontvangen. Koppel de Aloxberry-skill opnieuw in de Alexa-app om dit te herstellen.
REVOKED_BODY_MANY={count} Alexa-accounts hebben de toestemming verloren om statusupdates van je LoxBerry te ontvangen. Koppel de Aloxberry-skill opnieuw in de Alexa-app om dit te herstellen.
