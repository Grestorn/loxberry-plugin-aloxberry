SAVE_FAILED=Kon devices.json niet schrijven: {err}
SAVE_OK={count} apparaat(en) opgeslagen. Zeg "Alexa, ontdek mijn apparaten" om de wijzigingen op te pikken.
MIGRATION_NOTICE=De categorie van {count} apparaat(en) is automatisch bijgewerkt omdat Alexa de oude niet meer ondersteunt. Zeg "Alexa, ontdek mijn apparaten" om de wijzigingen toe te passen.
TIP_ENABLED=Vink uit om dit apparaat geconfigureerd maar verborgen voor Alexa te houden (geen ontdekking, geen opdrachten) zonder de instellingen kwijt te raken.
TIP_FRIENDLY_NAME=De naam die Alexa voor dit apparaat toont en die je uitspreekt om het met je stem te bedienen, bijv. "Alexa, zet <naam> aan". Houd hem uniek en makkelijk uit te spreken; vermijd dubbele namen tussen ruimtes.
TIP_CATEGORY=Vertelt Alexa wat voor soort apparaat dit is — dit bepaalt de tegel, het pictogram en sommige spraakvormen. SCENE_TRIGGER en ACTIVITY_TRIGGER zorgen ervoor dat Alexa het als een Scene behandelt: bruikbaar via spraak en in Routines, maar ZONDER apparaattegel, en niet hernoembaar of verwijderbaar in de Alexa-app. Elke andere categorie verschijnt als een normaal apparaat.
TIP_CAPABILITIES=Welke Alexa-functies dit apparaat aanbiedt. Elk vinkje is één Alexa-mogelijkheid; grijze opties zijn nog niet door de daemon geïmplementeerd.
TIP_SETTINGS=Apparaatspecifieke opties die finetunen hoe de gekozen mogelijkheden zich gedragen.
TIP_CAP_POWERCONTROLLER=Aan/uit-bediening. "Alexa, zet <naam> aan/uit."
TIP_CAP_BRIGHTNESSCONTROLLER=Dimmen van 0 tot 100%. "Alexa, zet <naam> op 40%", "dim <naam>."
TIP_CAP_COLORCONTROLLER=Volledige kleur (tint en verzadiging). "Alexa, maak <naam> blauw."
TIP_CAP_COLORTEMPERATURECONTROLLER=Witte kleurtemperatuur. "Alexa, maak <naam> warmer / koeler."
TIP_CAP_MODECONTROLLER=Selecteerbare benoemde modi of voorkeuzes — lichtscènes, ventilatorstand, radiozender, enz. "Alexa, zet <naam> op <modus>."
TIP_CAP_RANGECONTROLLER=Een numerieke waarde over een bereik, bijv. zonweringsstand of een schuif. "Alexa, zet <naam> op 50."
TIP_CAP_SCENECONTROLLER=Een eenmalige trigger (drukknop/scène). Werkt via spraak of in Routines; verschijnt onder Scènes, niet als apparaattegel.
TIP_CAP_THERMOSTATCONTROLLER=Streeftemperatuur plus verwarmings-/koelingsmodus. "Alexa, zet <naam> op 21 graden."
TIP_CAP_TEMPERATURESENSOR=Meldt de gemeten temperatuur aan Alexa (alleen-lezen). "Alexa, wat is de temperatuur van <naam>?"
TIP_CAP_SPEAKER=Volume en demping voor een audiozone. "Alexa, zet het volume van <naam> op 4", "demp <naam>."
TIP_CAP_PLAYBACKCONTROLLER=Afspeelknoppen (afspelen/pauzeren/stoppen/volgende/vorige). Let op: Alexa stuurt deze vaak naar zijn eigen muziekdienst in plaats van de skill.
TIP_CAP_PLAYBACKSTATEREPORTER=Meldt afspeel-/pauzeer-/stoptoestand zodat Alexa's "nu speelt"-tegel synchroon blijft (alleen-lezen).
TIP_CAP_TOGGLECONTROLLER=Een aan/uit-schakelaar voor één benoemde functie, bijv. shuffle. "Alexa, zet shuffle aan op <naam>."
TIP_CAP_MOTIONSENSOR=Meldt beweging/aanwezigheid gedetecteerd vs. vrij (alleen-lezen); bruikbaar als Routine-trigger.
TIP_CAP_CONTACTSENSOR=Meldt open vs. gesloten (alleen-lezen); bruikbaar als Routine-trigger.
TIP_CAP_HUMIDITYSENSOR=Meldt relatieve luchtvochtigheid in % aan Alexa (alleen-lezen).
TIP_CAP_ENDPOINTHEALTH=Meldt of het apparaat bereikbaar is. Wordt automatisch toegevoegd; niet door de gebruiker te kiezen.
TIP_REVERSE_AXIS=Keert de bereikrichting om zodat 0% en 100% verwisseld worden. Gebruik dit als een zonwering of schuif tegengesteld loopt aan wat Alexa verwacht.
TIP_USE_OVERRIDE=Wanneer ingesteld, wordt een temperatuurwijziging vanaf Alexa als een tijdelijke handmatige overschrijving gestuurd in plaats van het Loxone-schema permanent te wijzigen.
TIP_OVERRIDE_HOURS=Hoeveel uur een handmatige temperatuuroverschrijving actief blijft voordat het Loxone-schema weer overneemt (1-168).
TIP_VOLUME_STEP=Percentage waarmee het volume verandert per "luider/zachter"-spraakstap (1-50).
TIP_INVERT_POLARITY=Wisselt de open/gesloten- (gedetecteerd/vrij-)interpretatie van de sensor om. Gebruik dit als het contact omgekeerd meldt.
TIP_VENTILATION_HOURS=Hoe lang een via Alexa gevraagde snelheid- of moduswijziging actief blijft voordat de ventilatie terugkeert naar automatisch (1-168 u).
TIP_MODE_LABEL_ACTIVE=Eigen tekst die Alexa toont voor de "actieve" toestand van de sensor, bijv. "Open". Leeg laten voor de standaardwaarde.
TIP_MODE_LABEL_INACTIVE=Eigen tekst die Alexa toont voor de "inactieve" toestand, bijv. "Gesloten". Leeg laten voor de standaardwaarde.

