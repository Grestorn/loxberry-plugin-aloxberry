REVOKED_WHY=Dit gebeurt meestal als iemand de skill uitschakelt in de Alexa-app, of na een lange periode van inactiviteit. Spraakopdrachten kunnen nog werken, maar wijzigingen aan de toestand van apparaten in Loxone worden niet meer naar Alexa weerspiegeld totdat je opnieuw koppelt.
REVOKED_BADGE=opnieuw koppelen
