CATALOGUE_UNAVAILABLE_BODY=Il daemon non ha ancora letto la struttura LoxAPP3.json dal Miniserver e non è presente nessuna copia in cache sul disco. Avvia il daemon (scheda Configurazione) o fai clic su "Aggiorna dal Miniserver" appena è connesso.
