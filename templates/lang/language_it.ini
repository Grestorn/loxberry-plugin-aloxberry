[SETTINGS]
SECTION=Impostazioni
INSTRUCTIONS=Configurazione di runtime del daemon. Il salvataggio riavvia automaticamente il daemon affinché i nuovi valori abbiano effetto immediato.
BRIDGE_URL=URL bridge
LOCAL_PORT=Porta API locale
SAVE_BTN=Salva impostazioni e riavvia daemon
SAVED=Impostazioni salvate e daemon riavviato.
SAVED_RESTART_FAILED=Impostazioni salvate, ma il riavvio del daemon è fallito: {out}
SAVE_FAILED=Impossibile scrivere daemon.env: {err}
ERR_URL=L'URL bridge deve essere un URL http:// o https://.
ERR_PORT=La porta API locale deve essere un numero tra 1024 e 65535.
MS_MODE=Connessione al Miniserver
MS_MODE_WS=Live (WebSocket permanente)
MS_MODE_POLL=Polling (nessuna connessione permanente)
MS_POLL_INTERVAL=Intervallo di polling (minuti)
MS_MODE_HINT=In modalità polling il daemon non mantiene alcuna connessione permanente al Miniserver: a ogni intervallo si connette brevemente, legge tutti gli stati e si disconnette. Le variazioni di stato raggiungono Alexa con un ritardo fino a un intervallo; i comandi vocali non sono interessati. Utile se lo stack di rete del Miniserver è instabile con connessioni permanenti.
ERR_MS_MODE=Modalità di connessione al Miniserver non valida.
ERR_POLL_INTERVAL=L'intervallo di polling deve essere un numero tra 1 e 1440 minuti.
