ORPHAN=Questo controllo non esiste più in Loxone. Non viene più comunicato ad Alexa — eliminalo anche nell'app Alexa, poi rimuovilo qui. Se la cancellazione è stata un errore, ricrealo in Loxone Config e aggiorna il catalogo.
ORPHAN_BADGE=Assente in Loxone
ORPHAN_BANNER_TITLE={count} dispositivo/i esposti non esistono più in Loxone
ORPHAN_BANNER_BODY=Sono stati eliminati in Loxone Config. Aloxberry non li comunica più ad Alexa, quindi un rilevamento non può più riportarli indietro — ma Alexa conserva un dispositivo finché non lo elimini nell'app Alexa. Restano elencati qui sotto (sempre in cima, mai nascosti dai filtri) finché non li rimuovi qui.
ORPHAN_REMOVE_ALL=Rimuovi tutti gli assenti
INCOMPATIBLE=non supportato da Alexa
IN_PARENT=in
ALL_ROOMS=Tutte le stanze
ALL_TYPES=Tutti i tipi
ALL_CATEGORIES=Tutte le categorie
HIDE_EXPOSED=Nascondi quelli già esposti
HIDE_INCOMPATIBLE=Nascondi i tipi non compatibili con Alexa
UNSAVED=Modifiche non salvate
SAVE=Salva modifiche
SAVE_EMPTY=Nessun dato dispositivo inviato.
SAVE_BAD_JSON=I dati inviati non sono JSON valido.
SAVE_FAILED=Impossibile scrivere devices.json: {err}
SAVE_OK={count} dispositivo/i salvato/i. Dì "Alexa, cerca dispositivi" affinché Alexa rilevi le modifiche.
MIGRATION_NOTICE=La categoria di {count} dispositivo/i è stata aggiornata automaticamente perché Alexa non supporta più la precedente. Dì "Alexa, cerca dispositivi" per applicare le modifiche.
TIP_ENABLED=Deseleziona per mantenere questo dispositivo configurato ma nascosto ad Alexa (nessuna scoperta, nessun comando) senza perdere le sue impostazioni.
TIP_FRIENDLY_NAME=Il nome che Alexa mostra per questo dispositivo e che pronunci per controllarlo a voce, per esempio "Alexa, accendi <nome>". Mantienilo univoco e facile da pronunciare; evita duplicati tra le stanze.
TIP_CATEGORY=Indica ad Alexa che tipo di dispositivo è — determina la card, l'icona e alcune formulazioni vocali. SCENE_TRIGGER e ACTIVITY_TRIGGER fanno sì che Alexa lo tratti come una Scena: usabile a voce e nelle Routine, ma SENZA card del dispositivo, e non può essere rinominato o eliminato dall'app Alexa. Tutte le altre categorie appaiono come un dispositivo normale.
TIP_CAPABILITIES=Quali funzionalità Alexa questo dispositivo espone. Ogni casella è una capacità Alexa; quelle in grigio non sono ancora implementate dal daemon.
TIP_SETTINGS=Opzioni per dispositivo che regolano in dettaglio il comportamento delle capacità selezionate.
TIP_CAP_POWERCONTROLLER=Controllo on/off. "Alexa, accendi/spegni <nome>."
TIP_CAP_BRIGHTNESSCONTROLLER=Regolazione da 0 a 100%. "Alexa, imposta <nome> al 40%", "abbassa <nome>."
TIP_CAP_COLORCONTROLLER=Colore completo (tonalità e saturazione). "Alexa, fai <nome> blu."
TIP_CAP_COLORTEMPERATURECONTROLLER=Temperatura del bianco. "Alexa, fai <nome> bianco caldo / più freddo."
TIP_CAP_MODECONTROLLER=Modalità denominate o preset — scene luce, modalità ventilatore, stazione radio, ecc. "Alexa, imposta <nome> su <modalità>."
TIP_CAP_RANGECONTROLLER=Un valore numerico su un intervallo, per esempio posizione tapparella o cursore. "Alexa, imposta <nome> a 50."
TIP_CAP_SCENECONTROLLER=Un trigger una tantum (pulsante/scena). Eseguibile a voce o nelle Routine; appare sotto Scene, non come card del dispositivo.
TIP_CAP_THERMOSTATCONTROLLER=Temperatura target più modalità riscaldamento/raffrescamento. "Alexa, imposta <nome> a 21 gradi."
TIP_CAP_TEMPERATURESENSOR=Riporta la temperatura misurata ad Alexa (sola lettura). "Alexa, qual è la temperatura di <nome>?"
TIP_CAP_SPEAKER=Volume e muto per una zona audio. "Alexa, imposta il volume di <nome> a 4", "muta <nome>."
TIP_CAP_PLAYBACKCONTROLLER=Comandi di riproduzione (play/pausa/stop/successivo/precedente). Nota: Alexa spesso instrada questi comandi al proprio servizio musicale invece che alla skill.
TIP_CAP_PLAYBACKSTATEREPORTER=Riporta lo stato play/pausa/stop affinché la card "In riproduzione" di Alexa resti sincronizzata (sola lettura).
TIP_CAP_TOGGLECONTROLLER=Un interruttore on/off per una funzione denominata, per esempio shuffle. "Alexa, attiva shuffle su <nome>."
TIP_CAP_MOTIONSENSOR=Riporta movimento/presenza rilevato vs. libero (sola lettura); utilizzabile come trigger di Routine.
TIP_CAP_CONTACTSENSOR=Riporta aperto vs. chiuso (sola lettura); utilizzabile come trigger di Routine.
TIP_CAP_HUMIDITYSENSOR=Riporta l'umidità relativa in % ad Alexa (sola lettura).
TIP_CAP_ENDPOINTHEALTH=Riporta se il dispositivo è raggiungibile. Aggiunta automaticamente; non selezionabile.
TIP_REVERSE_AXIS=Inverte la direzione dell'intervallo, scambiando 0% e 100%. Usalo se una tapparella o un cursore funziona al contrario rispetto a ciò che Alexa si aspetta.
TIP_TIMED_TRIGGER_SLS=Modalità luce scale: "Alexa, accendi" avvia (o riavvia) il timer di Loxone invece di accendere in modo permanente, così la luce si spegne da sola allo scadere del tempo. "Spegni" spegne comunque subito.
TIP_TIMED_TRIGGER_CSW=Modalità interruttore comfort: "Alexa, accendi" invia un impulso al timer. Se la luce è spenta si accende per il tempo impostato; se è già accesa lo stesso impulso la spegne. "Spegni" spegne sempre subito.
TIP_USE_OVERRIDE=Se impostato, un cambio di temperatura da Alexa viene inviato come sovrascrittura manuale temporizzata invece di modificare in modo permanente la pianificazione Loxone.
TIP_OVERRIDE_HOURS=Per quante ore una sovrascrittura manuale di temperatura rimane attiva prima che riprenda la pianificazione Loxone (1-168).
TIP_VOLUME_STEP=Percentuale di variazione del volume per ogni passo vocale "più alto/più basso" (1-50).
TIP_INVERT_POLARITY=Scambia l'interpretazione aperto/chiuso (rilevato/libero) del sensore. Usalo se il contatto riporta invertito.
TIP_VENTILATION_HOURS=Per quanto tempo un cambio di velocità o modalità richiesto via Alexa resta applicato prima che la ventilazione torni in automatico (1-168 h).
TIP_MODE_LABEL_ACTIVE=Testo personalizzato che Alexa mostra per lo stato "attivo" del sensore, per esempio "Aperto". Lascia vuoto per l'impostazione predefinita.
TIP_MODE_LABEL_INACTIVE=Testo personalizzato che Alexa mostra per lo stato "inattivo", per esempio "Chiuso". Lascia vuoto per l'impostazione predefinita.

