REVOKED_TITLE=Ricollega la tua skill Alexa
REVOKED_BODY_ONE=Un account Alexa ha perso il permesso di ricevere aggiornamenti di stato dal tuo LoxBerry. Ricollega la skill Aloxberry nell'app Alexa per ripristinarlo.
REVOKED_BODY_MANY={count} account Alexa hanno perso il permesso di ricevere aggiornamenti di stato dal tuo LoxBerry. Ricollega la skill Aloxberry nell'app Alexa per ripristinarli.
REVOKED_STEPS=Nell'app Alexa: Skill e Giochi → Le tue skill → Aloxberry → Disabilita skill, poi Abilita e Collega di nuovo.
REVOKED_WHY=Di solito accade quando qualcuno disabilita la skill nell'app Alexa o dopo un lungo periodo di inattività. I comandi vocali possono continuare a funzionare, ma i cambi di stato dei dispositivi in Loxone non si rifletteranno in Alexa finché non ricolleghi.
REVOKED_BADGE=ricollegare
