SAVE_OK=Saved {count} device(s). Say "Alexa, discover my devices" to pick up the changes.
MIGRATION_NOTICE={count} device(s) had their category updated automatically because Alexa no longer supports the old one. Say "Alexa, discover my devices" so the changes take effect.
TIP_ENABLED=Uncheck to keep this device configured but hidden from Alexa (no discovery, no commands) without losing its settings.
TIP_FRIENDLY_NAME=The name Alexa shows for this device and that you say to control it by voice, e.g. "Alexa, turn on <name>". Keep it unique and easy to pronounce; avoid duplicates across rooms.
TIP_CATEGORY=Tells Alexa what kind of device this is — it drives the tile, icon and some voice phrasing. SCENE_TRIGGER and ACTIVITY_TRIGGER make Alexa treat it as a Scene: usable by voice and in Routines, but with NO device tile, and it cannot be renamed or deleted in the Alexa app. Every other category appears as a normal device.
TIP_CAPABILITIES=Which Alexa features this device exposes. Each checkbox is one Alexa capability; greyed-out ones are not implemented by the daemon yet.
TIP_SETTINGS=Per-device options that fine-tune how the selected capabilities behave.
TIP_CAP_POWERCONTROLLER=On/off control. "Alexa, turn <name> on/off."
TIP_CAP_BRIGHTNESSCONTROLLER=Dimming from 0 to 100%. "Alexa, set <name> to 40%", "dim <name>."
TIP_CAP_COLORCONTROLLER=Full colour (hue and saturation). "Alexa, make <name> blue."
TIP_CAP_COLORTEMPERATURECONTROLLER=White colour temperature. "Alexa, make <name> warm white / cooler."
TIP_CAP_MODECONTROLLER=Selectable named modes or presets — light scenes, fan mode, radio station, etc. "Alexa, set <name> to <mode>."
TIP_CAP_RANGECONTROLLER=A numeric value over a range, e.g. blind position or a slider. "Alexa, set <name> to 50."
TIP_CAP_SCENECONTROLLER=A one-shot trigger (push-button/scene). Runs by voice or in Routines; appears under Scenes, not as a device tile.
TIP_CAP_THERMOSTATCONTROLLER=Target temperature plus heating/cooling mode. "Alexa, set <name> to 21 degrees."
TIP_CAP_TEMPERATURESENSOR=Reports the measured temperature to Alexa (read-only). "Alexa, what's the temperature of <name>?"
TIP_CAP_SPEAKER=Volume and mute for an audio zone. "Alexa, set <name> volume to 4", "mute <name>."
TIP_CAP_PLAYBACKCONTROLLER=Transport controls (play/pause/stop/next/previous). Note: Alexa often routes these to its own music service instead of the skill.
TIP_CAP_PLAYBACKSTATEREPORTER=Reports play/pause/stop state so Alexa's now-playing tile stays in sync (read-only).
TIP_CAP_TOGGLECONTROLLER=An on/off switch for one named feature, e.g. shuffle. "Alexa, turn on shuffle on <name>."
TIP_CAP_MOTIONSENSOR=Reports motion/presence detected vs. clear (read-only); usable as a Routine trigger.
TIP_CAP_CONTACTSENSOR=Reports open vs. closed (read-only); usable as a Routine trigger.
TIP_CAP_HUMIDITYSENSOR=Reports relative humidity in % to Alexa (read-only).
TIP_CAP_ENDPOINTHEALTH=Reports whether the device is reachable. Added automatically; not user-selectable.
TIP_REVERSE_AXIS=Flips the range direction so 0% and 100% are swapped. Use if a blind or slider runs opposite to what Alexa expects.
TIP_TIMED_TRIGGER_SLS=Stairwell-light mode: "Alexa, turn on" starts (or restarts) the Loxone timer instead of switching on permanently, so the light turns itself off when the time runs out. "Turn off" still switches off immediately.
TIP_TIMED_TRIGGER_CSW=Comfort-switch mode: "Alexa, turn on" sends a timer trigger. If the light is off it turns on for the timed period; if it is already on the same trigger turns it off. "Turn off" always switches off immediately.
TIP_USE_OVERRIDE=When set, an Alexa temperature change is sent as a timed manual override instead of permanently changing the Loxone schedule.
TIP_OVERRIDE_HOURS=How many hours a manual temperature override stays active before the Loxone schedule resumes (1-168).
TIP_VOLUME_STEP=Percent the volume changes per "louder/quieter" voice step (1-50).
TIP_INVERT_POLARITY=Swaps the sensor's open/closed (detected/clear) interpretation. Use if the contact reports inverted.
TIP_VENTILATION_HOURS=How long a speed or mode change requested via Alexa stays applied before ventilation returns to automatic (1-168 h).
TIP_MODE_LABEL_ACTIVE=Custom text Alexa shows for the sensor's "active" state, e.g. "Open". Leave blank for the default.
TIP_MODE_LABEL_INACTIVE=Custom text Alexa shows for the "inactive" state, e.g. "Closed". Leave blank for the default.

