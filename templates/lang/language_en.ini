MS_MODE_HINT=Polling mode holds no permanent connection to the Miniserver: at every interval the daemon connects briefly, reads all states and disconnects again. State changes reach Alexa with up to one interval of delay; voice commands are not affected. Use this if your Miniserver's network stack is unstable under permanent connections.
ERR_MS_MODE=Invalid Miniserver connection mode.
ERR_POLL_INTERVAL=Poll interval must be a number between 1 and 1440 minutes.
