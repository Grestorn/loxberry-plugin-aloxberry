[HEALTH]
BRIDGE_DOWN_TITLE=La connexion à la bridge cloud Aloxberry est interrompue
BRIDGE_DOWN_BODY=Alexa ne peut pas atteindre ton LoxBerry pour le moment, et les mises à jour d'état n'arrivent pas jusqu'à Alexa. Ouvre l'onglet Configuration pour vérifier l'état de la bridge et le journal du daemon.
REVOKED_TITLE=Reliez votre skill Alexa
REVOKED_BODY_ONE=Un compte Alexa a perdu la permission de recevoir les mises à jour d'état depuis ton LoxBerry. Relie la skill Aloxberry dans l'application Alexa pour la rétablir.
REVOKED_BODY_MANY={count} comptes Alexa ont perdu la permission de recevoir les mises à jour d'état depuis ton LoxBerry. Relie la skill Aloxberry dans l'application Alexa pour les rétablir.
REVOKED_STEPS=Dans l'application Alexa : Skills et Jeux → Vos Skills → Aloxberry → Désactiver la skill, puis Activer et Lier à nouveau.
REVOKED_WHY=Cela arrive généralement quand quelqu'un désactive la skill dans l'application Alexa, ou après une longue période d'inactivité. Les commandes vocales peuvent toujours fonctionner, mais les changements d'état des appareils dans Loxone ne se reflèteront pas dans Alexa tant que tu n'as pas relié.
REVOKED_BADGE=à relier
OK_BADGE=ok

[SETTINGS]
SECTION=Réglages
INSTRUCTIONS=Configuration d'exécution du daemon. L'enregistrement redémarre automatiquement le daemon pour que les nouvelles valeurs prennent effet immédiatement.
BRIDGE_URL=URL de la bridge
LOCAL_PORT=Port API local
SAVE_BTN=Enregistrer les réglages et redémarrer le daemon
SAVED=Réglages enregistrés et daemon redémarré.
SAVED_RESTART_FAILED=Réglages enregistrés, mais le redémarrage du daemon a échoué : {out}
SAVE_FAILED=Impossible d'écrire daemon.env : {err}
ERR_URL=L'URL de la bridge doit être une URL http:// ou https://.
ERR_PORT=Le port API local doit être un nombre entre 1024 et 65535.
MS_MODE=Connexion au Miniserver
MS_MODE_WS=En direct (WebSocket permanente)
MS_MODE_POLL=Interrogation périodique (sans connexion permanente)
MS_POLL_INTERVAL=Intervalle d'interrogation (minutes)
MS_MODE_HINT=En mode interrogation, le daemon ne maintient aucune connexion permanente au Miniserver : à chaque intervalle, il se connecte brièvement, lit tous les états puis se déconnecte. Les changements d'état atteignent Alexa avec un retard pouvant aller jusqu'à un intervalle ; les commandes vocales ne sont pas affectées. Utile si la pile réseau du Miniserver est instable avec des connexions permanentes.
ERR_MS_MODE=Mode de connexion au Miniserver invalide.
ERR_POLL_INTERVAL=L'intervalle d'interrogation doit être un nombre entre 1 et 1440 minutes.
