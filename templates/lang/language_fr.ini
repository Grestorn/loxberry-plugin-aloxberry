[DEVICES]
SECTION=Appareils exposés à Alexa
NO_PAIRINGS_TITLE=Skill pas encore liée
NO_PAIRINGS_BODY=Configurer des appareils ici n'a de sens qu'une fois la skill Aloxberry liée à ton compte Alexa. Ouvre d'abord l'onglet Configuration et suis les instructions d'appairage.
NO_PAIRINGS_GOTO=Aller à la configuration
GATEKEEPER_TITLE=Intégration Alexa
MASTER_LABEL=Intégration Alexa active
MASTER_HINT=Désactivée, le daemon coupe toute communication avec la bridge. Alexa ne peut pas atteindre ce LoxBerry tant que tu ne réactives pas.
VACATION_LABEL=Mettre les commandes Alexa en pause quand un Virtual Status est activé
VACATION_HINT=Activé, les commandes Alexa→Miniserver sont bloquées tant que le Virtual Status Loxone choisi est ON ; les mises à jour d'état continuent d'aller vers Alexa.
VACATION_MODE=Virtual Status
VACATION_PICK=choisir un Virtual Status
VACATION_NO_VS=(aucun Virtual Status trouvé — créez-en un dans Loxone Config)
CATALOGUE_HEADING=Catalogue Loxone
CATALOGUE_UNAVAILABLE_TITLE=Catalogue indisponible
CATALOGUE_UNAVAILABLE_BODY=Le daemon n'a pas encore lu la structure LoxAPP3.json depuis ton Miniserver et aucune copie en cache n'est sur le disque. Démarre le daemon (onglet Configuration) ou clique sur « Actualiser depuis le Miniserver » une fois la connexion établie.
REFRESH_BTN=Actualiser le catalogue
CONTROLS=contrôles
FETCHED_AT=récupéré
STALE=périmé (cache disque utilisé)
FILTERS=Filtres
AVAILABLE=Contrôles Loxone disponibles
EXPOSED=Exposés à Alexa
NO_CANDIDATES=Aucun contrôle ne correspond aux filtres actuels.
NO_EXPOSED=Aucun appareil exposé pour le moment. Choisis-en un à gauche.
ADD=Ajouter
REMOVE=Retirer
ENABLED=Activé
FRIENDLY_NAME=Nom convivial
CATEGORY=Catégorie
CAPABILITIES=Capacités
SETTINGS=Réglages
REVERSE_AXIS=Inverser le sens
TIMED_TRIGGER_SLS=Déclencher la minuterie
TIMED_TRIGGER_CSW=Basculer avec minuterie
USE_OVERRIDE=Surcharge
OVERRIDE_HOURS=Heures :
VOLUME_STEP=Pas :
INVERT_POLARITY=Inverser la logique
VENTILATION_HOURS=Durée (h) :
MODE_LABEL_ACTIVE=Actif :
MODE_LABEL_INACTIVE=Inactif :
PHASE3=(Phase 3)
ORPHAN=Ce contrôle n'existe plus dans Loxone. Il n'est plus signalé à Alexa — supprime-le aussi dans l'application Alexa, puis retire-le ici. Si la suppression était une erreur, recrée-le dans Loxone Config et actualise le catalogue.
ORPHAN_BADGE=Absent de Loxone
ORPHAN_BANNER_TITLE={count} appareil(s) exposés n'existent plus dans Loxone
ORPHAN_BANNER_BODY=Ils ont été supprimés dans Loxone Config. Aloxberry ne les signale plus à Alexa, une détection ne peut donc plus les faire revenir — mais Alexa conserve un appareil jusqu'à ce que tu le supprimes dans l'application Alexa. Ils restent listés ci-dessous (toujours en haut, jamais masqués par les filtres) jusqu'à ce que tu les retires ici.
ORPHAN_REMOVE_ALL=Retirer tous les absents
INCOMPATIBLE=non pris en charge par Alexa
IN_PARENT=dans
ALL_ROOMS=Toutes les pièces
ALL_TYPES=Tous les types
ALL_CATEGORIES=Toutes les catégories
HIDE_EXPOSED=Masquer les appareils déjà exposés
HIDE_INCOMPATIBLE=Masquer les types incompatibles avec Alexa
UNSAVED=Modifications non enregistrées
SAVE=Enregistrer les modifications
SAVE_EMPTY=Aucune donnée d'appareil transmise.
SAVE_BAD_JSON=Les données transmises ne sont pas du JSON valide.
SAVE_FAILED=Impossible d'écrire devices.json : {err}
SAVE_OK={count} appareil(s) enregistré(s). Dis « Alexa, découvre mes appareils » pour qu'Alexa prenne en compte les changements.
MIGRATION_NOTICE=La catégorie de {count} appareil(s) a été mise à jour automatiquement parce qu'Alexa ne la prend plus en charge. Dis « Alexa, découvre mes appareils » pour que les changements soient appliqués.
TIP_ENABLED=Décoche pour garder cet appareil configuré mais masqué d'Alexa (pas de découverte, pas de commandes) sans perdre ses réglages.
TIP_FRIENDLY_NAME=Le nom qu'Alexa affiche pour cet appareil et que tu prononces pour le contrôler à la voix, par exemple « Alexa, allume <nom> ». Garde-le unique et facile à prononcer ; évite les doublons entre les pièces.
TIP_CATEGORY=Indique à Alexa quel type d'appareil c'est — cela détermine la vignette, l'icône et certaines formulations vocales. SCENE_TRIGGER et ACTIVITY_TRIGGER font qu'Alexa le traite comme une scène : utilisable à la voix et dans les routines, mais SANS vignette d'appareil, et il ne peut pas être renommé ou supprimé dans l'application Alexa. Toutes les autres catégories apparaissent comme un appareil normal.
TIP_CAPABILITIES=Quelles fonctions Alexa cet appareil expose. Chaque case est une capacité Alexa ; celles grisées ne sont pas encore implémentées par le daemon.
TIP_SETTINGS=Options par appareil qui affinent le comportement des capacités sélectionnées.
TIP_CAP_POWERCONTROLLER=Contrôle marche/arrêt. « Alexa, allume/éteins <nom>. »
TIP_CAP_BRIGHTNESSCONTROLLER=Variation de 0 à 100 %. « Alexa, règle <nom> sur 40 % », « tamise <nom>. »
TIP_CAP_COLORCONTROLLER=Couleur complète (teinte et saturation). « Alexa, mets <nom> en bleu. »
TIP_CAP_COLORTEMPERATURECONTROLLER=Température de blanc. « Alexa, mets <nom> en blanc chaud / plus froid. »
TIP_CAP_MODECONTROLLER=Modes nommés ou préréglages — scènes lumineuses, mode ventilateur, station radio, etc. « Alexa, mets <nom> sur <mode>. »
TIP_CAP_RANGECONTROLLER=Une valeur numérique sur une plage, par exemple position de volet ou un curseur. « Alexa, règle <nom> sur 50. »
TIP_CAP_SCENECONTROLLER=Déclencheur ponctuel (bouton-poussoir/scène). Exécutable à la voix ou dans les routines ; apparaît sous Scènes, pas comme vignette d'appareil.
TIP_CAP_THERMOSTATCONTROLLER=Température cible plus mode chauffage/refroidissement. « Alexa, règle <nom> sur 21 degrés. »
TIP_CAP_TEMPERATURESENSOR=Rapporte la température mesurée à Alexa (lecture seule). « Alexa, quelle est la température de <nom> ? »
TIP_CAP_SPEAKER=Volume et muet pour une zone audio. « Alexa, règle le volume de <nom> sur 4 », « coupe le son de <nom>. »
TIP_CAP_PLAYBACKCONTROLLER=Commandes de lecture (play/pause/stop/suivant/précédent). Note : Alexa redirige souvent ces commandes vers son propre service musical plutôt que vers la skill.
TIP_CAP_PLAYBACKSTATEREPORTER=Rapporte l'état lecture/pause/stop pour que la vignette « En cours de lecture » d'Alexa reste synchronisée (lecture seule).
TIP_CAP_TOGGLECONTROLLER=Interrupteur marche/arrêt pour une fonction nommée, par exemple lecture aléatoire. « Alexa, active la lecture aléatoire sur <nom>. »
TIP_CAP_MOTIONSENSOR=Rapporte mouvement/présence détecté vs. dégagé (lecture seule) ; utilisable comme déclencheur de routine.
TIP_CAP_CONTACTSENSOR=Rapporte ouvert vs. fermé (lecture seule) ; utilisable comme déclencheur de routine.
TIP_CAP_HUMIDITYSENSOR=Rapporte l'humidité relative en % à Alexa (lecture seule).
TIP_CAP_ENDPOINTHEALTH=Rapporte si l'appareil est joignable. Ajoutée automatiquement ; non sélectionnable.
TIP_REVERSE_AXIS=Inverse le sens de la plage, échangeant 0 % et 100 %. Utilise si un volet ou un curseur fonctionne à l'inverse de ce qu'Alexa attend.
TIP_TIMED_TRIGGER_SLS=Mode minuterie d'escalier : « Alexa, allume » démarre (ou redémarre) la minuterie Loxone au lieu d'allumer en permanence — la lumière s'éteint d'elle-même à la fin du délai. « Éteins » coupe toujours immédiatement.
TIP_TIMED_TRIGGER_CSW=Mode interrupteur confort : « Alexa, allume » envoie une impulsion de minuterie. Si la lumière est éteinte, elle s'allume pour la durée définie ; si elle est déjà allumée, la même impulsion l'éteint. « Éteins » coupe toujours immédiatement.
TIP_USE_OVERRIDE=Si activé, un changement de température depuis Alexa est envoyé comme une surcharge manuelle temporisée au lieu de modifier durablement le planning Loxone.
TIP_OVERRIDE_HOURS=Combien d'heures une surcharge manuelle de température reste active avant que le planning Loxone reprenne (1-168).
TIP_VOLUME_STEP=Pourcentage de variation du volume par pas vocal « plus fort/moins fort » (1-50).
TIP_INVERT_POLARITY=Échange l'interprétation ouvert/fermé (détecté/dégagé) du capteur. Utilise si le contact rapporte à l'envers.
TIP_VENTILATION_HOURS=Combien de temps un changement de vitesse ou de mode demandé via Alexa reste appliqué avant que la ventilation repasse en automatique (1-168 h).
TIP_MODE_LABEL_ACTIVE=Texte personnalisé qu'Alexa affiche pour l'état « actif » du capteur, par exemple « Ouvert ». Laisser vide pour la valeur par défaut.
TIP_MODE_LABEL_INACTIVE=Texte personnalisé qu'Alexa affiche pour l'état « inactif », par exemple « Fermé ». Laisser vide pour la valeur par défaut.

